<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SagaPyaw" />
<link rel="icon" href="data:," />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>SagaPyaw — မြန်မာ အသံ</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #12151b; --line: #262b35;
    --fg: #e6e9ef; --dim: #8b93a3; --accent: #7cc4ff; --ok: #6ee7a8;
    --warn: #ffb86b; --bad: #ff7a7a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --mm: "Noto Sans Myanmar", "Padauk", "Myanmar Text", "Myanmar Sangam MN", sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: calc(16px + var(--safe-t)) 14px calc(24px + var(--safe-b));
    overscroll-behavior-y: contain;
    /* Column + min-height so the credit line can sit at the bottom of a short page
       instead of floating in the middle of it. */
    box-sizing: border-box; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  main {
    max-width: 600px; width: 100%; margin: 0 auto;
    flex: 1 0 auto; display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  /* Brand mark is Latin: use the UI stack, not the Burmese one. */
  h1 { font-size: 18px; margin: 0; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  /* Voice picker: four pills between the text box and the button. The border is
     the state — green = the voice in use, blue = downloaded and ready, grey =
     needs another 181 MB. */
  .voices { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 0; }
  .voices button {
    display: inline-flex; align-items: center; gap: 7px; min-height: 36px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 11px;
    color: var(--fg); font-family: inherit; font-size: 13.5px; font-weight: 500;
    padding: 0 12px; cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .voices button small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--dim); }
  /* Downloaded: blue. */
  .voices button.cached { border-color: var(--accent); color: var(--accent); }
  .voices button.cached small { color: var(--accent); opacity: .8; }
  /* In use: green, and it outranks blue — "which voice am I hearing" is the
     question this row answers, and the answer must be the loudest thing on it. */
  .voices button[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
  .voices button[aria-pressed="true"] small { color: var(--ok); opacity: .8; }
  /* The cost lives here, once, instead of on every pill: four copies of
     "181.2 MB" is what pushed the row onto two lines. */
  .voicenote { margin: 12px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--warn); }
  .voicenote[hidden] { display: none; }
  /* Four pills do not fit across a phone, and flex-wrap leaves the fourth alone
     on its own line. A fixed 2×2 grid reads as deliberate instead. */
  @media (max-width: 430px) {
    .voices { display: grid; grid-template-columns: 1fr 1fr; }
    .voices button { justify-content: center; }
  }
  .envchip { display: none; }
  .envchip.show { display: inline-flex; align-items: center; }
  .envchip .dot { margin-right: 5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; background: var(--panel2);
    color: var(--fg); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; font-family: var(--mm); font-size: 17px; line-height: 1.95; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--dim); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button {
    -webkit-appearance: none; appearance: none; background: #1d222b; color: var(--fg);
    border: 1px solid var(--line); border-radius: 11px; padding: 0 16px; min-height: 50px;
    font-size: 16px; font-family: var(--mm); cursor: pointer; touch-action: manipulation;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .42; cursor: default; }
  button.primary { flex: 1; background: #123047; border-color: #23577a; color: var(--accent); font-weight: 500; }
  /* Play and stop are one control: while a run is live the label and colour
     change, so stopping costs no extra button and no permanently greyed one. */
  button.primary.stop { background: #2a1a1f; border-color: #5c2f39; color: var(--bad); }
  /* Export is the rare action, so it is a quiet text button under the primary
     instead of a peer of it. Full width keeps the tap target honest on a phone. */
  button.linkbtn {
    display: block; width: 100%; min-height: 34px; margin-top: 2px; padding: 0;
    background: transparent; border: 0; color: var(--dim); font-size: 13px;
  }
  button.linkbtn:hover:not(:disabled), button.linkbtn:focus-visible { color: var(--accent); }
  button.ghost { background: transparent; color: var(--dim); min-height: 36px; font-size: 13px; padding: 0 10px; }
  .bar { height: 4px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .18s linear; }
  .bar.hide { display: none; }
  .status { font-size: 13px; color: var(--dim); margin-top: 10px; word-break: break-word; }
  .status:empty { display: none; }
  .status .ok { color: var(--ok); } .status .warn { color: var(--warn); } .status .bad { color: var(--bad); }
  .status code { font-family: var(--mono); font-size: 12px; }
  /* Appears once, after a run that the measurement says fell behind real time. */
  .hint { margin: 10px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--warn); }
  .hint[hidden] { display: none; }
  .hint b { color: var(--fg); font-weight: 500; }
  .out { display: none; }
  .out.show { display: block; }
  audio { width: 100%; height: 42px; display: block; filter: invert(.92) hue-rotate(180deg); border-radius: 10px; }
  .dl { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px; flex-wrap: wrap; }
  .dl a {
    display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px;
    background: #123047; border: 1px solid #23577a; border-radius: 10px;
    color: var(--accent); text-decoration: none; font-family: var(--mm); font-size: 14px;
  }
  .dl .size { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  /* Everything below is developer/diagnostic output, off unless ?dev=1. */
  .devonly { display: none; }
  body.dev .devonly { display: block; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .stats b { color: var(--fg); font-weight: 500; }
  .phon {
    font-family: var(--mono); font-size: 12px; color: #9fd0f0; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-top: 10px;
    max-height: 92px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  .phon:empty { display: none; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-top: 10px; }
  details .inner { padding-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  details .inner code { font-family: var(--mono); color: var(--accent); }
  details .inner select {
    font-family: var(--mono); font-size: 12px; color: var(--fg); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 4px; margin-left: 2px;
  }
  /* Attribution, not navigation: small, quiet, and the only outbound link on the page. */
  footer.credit {
    margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 11.5px; line-height: 1.8; color: var(--dim); text-align: center;
  }
  footer.credit .by { margin-top: 3px; font-size: 11px; opacity: .72; }
  footer.credit a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted rgba(124, 196, 255, .45); }
  footer.credit a:hover, footer.credit a:focus-visible { border-bottom-color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>SagaPyaw</h1>
    <span class="envchip" id="env" hidden></span>
    <button class="ghost" id="install" hidden>ဖုန်းမှာ ထည့်ပါ</button>
  </header>

  <section class="card">
    <textarea id="text" spellcheck="false" autocomplete="off" placeholder="အသံထုတ်လိုသော စာသားရေးရန် …"></textarea>
    <p class="voicenote" id="voiceNote" hidden>အသံ တစ်မျိုးလျှင် 181.2 MB — ဒေါင်းရာမှာ အချိန်ကြာနိုင်တယ်</p>
    <div class="voices" id="voiceList" role="group" aria-label="အသံ"></div>
    <div class="actions">
      <button class="primary" id="read">ဖတ်ပါ</button>
    </div>
    <button class="linkbtn" id="export">WAV ထုတ်ပါ ↓</button>
    <div class="bar hide" id="bar"><i></i></div>
    <div class="status" id="status"></div>
    <p class="hint" id="hint" hidden></p>
  </section>

  <section class="card out" id="out">
    <audio id="audio" controls preload="metadata"></audio>
    <div class="dl">
      <a id="dl" download="sagapyaw.wav">WAV ဒေါင်းလုပ်</a>
      <span class="size" id="size"></span>
    </div>
  </section>

  <details id="metaCard">
    <summary>အခြေအနေ</summary>
    <div class="inner" id="details"></div>
    <div class="devonly">
      <div class="stats" id="stats"></div>
      <div class="phon" id="phon"></div>
    </div>
  </details>

  <footer class="credit">
    <div>အသံ မော်ဒယ် <a href="https://huggingface.co/YeeNyunn/nara-mini-v1" target="_blank" rel="noopener noreferrer">nara-mini-v1</a>
    — YeeNyunn · Apache-2.0</div>
    <div class="by"><a href="https://github.com/kowinhtike/SagaPyaw" target="_blank" rel="noopener noreferrer">kowinhtike</a>
    · AI assistant နှင့် အတူ ဖန်တီးထားသည်</div>
  </footer>
</main>

<script type="module">
import * as ort from './vendor/ort.wasm.bundle.min.mjs';
import { SagaSynthesizer, encodeWav } from '../dist/sagapyaw.mjs';
import { StreamPlayer } from './player.js';
import {
  loadFile, isCached, requestPersistence, storageEstimate, clearModelCache,
  touchVoice, evictVoicesBeyondRecent,
} from './model-store.js';

const SR = 24000;
const params = new URLSearchParams(location.search);

// The four voices of nara-mini-v1. Same topology and byte-for-byte identical
// file sizes, different weights — so the constants below hold for every voice.
const VOICES = [
  { id: 'shoon', label: 'Shoon' },
  { id: 'thazin', label: 'Thazin' },
  { id: 'htet-myat', label: 'Htet Myat' },
  { id: 'ko-banyar', label: 'Ko Banyar' },
];
const voiceLabel = (id) => VOICES.find((v) => v.id === id)?.label ?? id;

let VOICE = params.get('voice') ?? VOICES[0].id;
if (!VOICES.some((v) => v.id === VOICE)) VOICE = VOICES[0].id;

const MODEL_REPO = 'https://huggingface.co/yelin201875/Yelinvoice/resolve/main/onnx';
const filesFor = (id) => {
  const base = `${MODEL_REPO}/${encodeURIComponent(id)}`;
  return {
    encoder: { url: `${base}/encoder.onnx`, weight: 78_268_090, label: 'encoder' },
    decoder: { url: `${base}/decoder.onnx`, weight: 111_686_677, label: 'decoder' },
    voice: { url: `${base}/voice.json`, weight: 46_300, label: 'voice.json' },
  };
};
let FILES = filesFor(VOICE);
const TOTAL_WEIGHT = 78_268_090 + 111_686_677 + 46_300;

const isolated = self.crossOriginIsolated === true;
const hw = navigator.hardwareConcurrency || 2;
const forced = Number(params.get('threads'));
ort.env.wasm.numThreads = forced > 0 ? forced : isolated ? Math.min(4, hw) : 1;
ort.env.wasm.wasmPaths = new URL('./vendor/', document.baseURI).href;
// Run inference in a worker: a 5 s decode on the main thread freezes the page,
// which on a phone looks like the app has hung and makes "ရပ်" unresponsive.
ort.env.wasm.proxy = params.get('proxy') !== '0';

const $ = (id) => document.getElementById(id);
const say = (html) => { $('status').innerHTML = html; };

// `?text=` pre-fills the box so a link can carry the sentence to speak. The box
// is empty by default: the placeholder is a prompt, not a sample to overwrite.
const presetText = params.get('text');
if (presetText) $('text').value = presetText;
// Diagnostics (RTF, tokens, phonemes, storage state) are for whoever is debugging
// the model, not for people reading text aloud. One query param keeps them out of
// the way without adding a switch to the UI.
const devParam = params.get('dev');
const DEV = (devParam !== null && devParam !== '0') || params.has('auto');
if (DEV) {
  document.body.classList.add('dev');
  // Keep the harness output readable: the diagnostics live inside a closed
  // <details>, and innerText of a closed details is empty.
  $('metaCard').open = true;
  $('env').hidden = false;
  $('env').classList.add('show');
}
const setBar = (frac) => {
  $('bar').classList.toggle('hide', !(frac > 0 && frac < 1));
  $('bar').firstElementChild.style.width = `${Math.round(frac * 100)}%`;
};
const bytesLabel = (n) => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${(n / 1024).toFixed(0)} KB`;
const secs = (ms) => `${(ms / 1000).toFixed(2)}s`;

document.title = 'SagaPyaw — မြန်မာ အသံ';

/* ---------------------------------------------------------------- model ---- */

let synth = null;
let synthVoice = null;
let loading = null;
const fileFrac = new Map();

function overallProgress() {
  let sum = 0;
  for (const f of Object.values(FILES)) sum += f.weight * (fileFrac.get(f.label) ?? 0);
  return sum / TOTAL_WEIGHT;
}

async function loadBytes(file, phase) {
  const bytes = await loadFile(file.url, {
    label: file.label,
    onProgress: (frac) => {
      fileFrac.set(file.label, frac);
      const pct = Math.round(overallProgress() * 100);
      setBar(overallProgress());
      say(`${phase} · <b>${pct}%</b> · ${bytesLabel(overallProgress() * TOTAL_WEIGHT)} / ${bytesLabel(TOTAL_WEIGHT)}`);
    },
  });
  fileFrac.set(file.label, 1);
  return bytes;
}

async function ensureModel() {
  if (synth && synthVoice === VOICE) return synth;
  if (loading) return loading;

  loading = (async () => {
    // One voice at a time. The previous graphs are released before a single byte
    // of the next voice is fetched: 360 MB of weights plus two ORT heaps is what
    // makes a phone reload the tab.
    if (synth) {
      synth.dispose();
      synth = null;
      synthVoice = null;
    }
    fileFrac.clear();

    const cached = await isCached(Object.values(FILES).map((f) => f.url));
    const phase = cached ? 'cache ထဲကနေ ဖတ်နေတယ်' : 'မော်ဒယ် ဒေါင်းလုပ်နေတယ်';

    if (!cached) {
      say(`${phase} · ${voiceLabel(VOICE)} · ပထမအကြိမ်ပါ (${bytesLabel(TOTAL_WEIGHT)})`);
      requestPersistence().then(refreshStorage);
    }

    const voiceBytes = await loadBytes(FILES.voice, phase);
    const metadata = JSON.parse(new TextDecoder().decode(voiceBytes));

    // One graph at a time: on a phone, holding both byte arrays plus two ORT
    // heaps at once is what pushes a tab over its memory budget.
    const encBytes = await loadBytes(FILES.encoder, phase);
    const encoder = await ort.InferenceSession.create(encBytes, {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'all',
    });
    const decBytes = await loadBytes(FILES.decoder, phase);
    const decoder = await ort.InferenceSession.create(decBytes, {
      executionProviders: ['wasm'],
      graphOptimizationLevel: 'all',
    });

    synth = SagaSynthesizer.fromSessions(ort, encoder, decoder, metadata);
    synthVoice = VOICE;
    setBar(1);
    // The voice just used goes to the front of the recency list, and anything
    // beyond the two most recent is dropped from the cache.
    touchVoice(VOICE);
    evictVoicesBeyondRecent().then(renderVoices).catch(() => {});
    return synth;
  })();

  try {
    return await loading;
  } finally {
    loading = null;
  }
}

/* --------------------------------------------------------------- player ---- */

let player = null;
function getPlayer() {
  if (!player) {
    player = new StreamPlayer(SR);
    player.onstate = (state) => {
      if (state === 'idle' && !running) setBusy(false);
    };
  }
  return player;
}

/**
 * One control for both actions. `busy` comes from the caller; the player's own
 * tail is added here because a stream can finish rendering while its last
 * chunks are still sounding, and stopping has to stay reachable until they stop.
 */
function setBusy(busy) {
  const active = busy || Boolean(player?.playing);
  $('read').classList.toggle('stop', active);
  $('read').textContent = active ? 'ရပ်' : 'ဖတ်ပါ';
  $('export').disabled = active;
}

/* ------------------------------------------------------------ wav build ---- */

/** Peak-normalise to 0.92. The model sits around 0.11 RMS, which is quiet. */
function peakNormalize(samples) {
  let peak = 0;
  for (let i = 0; i < samples.length; i += 1) {
    const v = Math.abs(samples[i]);
    if (v > peak) peak = v;
  }
  if (peak < 1e-4) return 0;
  const gain = Math.min(4, 0.92 / peak);
  if (Math.abs(gain - 1) < 0.02) return 1;
  for (let i = 0; i < samples.length; i += 1) samples[i] = Math.max(-1, Math.min(1, samples[i] * gain));
  return gain;
}

/** Drop leading/trailing near-silence, keeping 40 ms of air on each side. */
function trimSilence(samples, threshold = 0.004) {
  const pad = Math.round(SR * 0.04);
  let start = 0;
  while (start < samples.length && Math.abs(samples[start]) < threshold) start += 1;
  let end = samples.length - 1;
  while (end > start && Math.abs(samples[end]) < threshold) end -= 1;
  if (start >= end) return samples;
  // Only trim when the silence is long enough to be worth it (>= 80 ms).
  if (start < SR * 0.08 && samples.length - end < SR * 0.08) return samples;
  return samples.slice(Math.max(0, start - pad), Math.min(samples.length, end + pad));
}

function mergeChunks(parts) {
  let length = 0;
  for (const p of parts) length += p.length;
  const merged = new Float32Array(length);
  let at = 0;
  for (const p of parts) { merged.set(p, at); at += p.length; }
  return merged;
}

let objectUrl = null;

/**
 * Turn the accumulated chunks into one WAV and show it in the player card.
 *
 * It never starts playing on its own: in Realtime mode the audio has already
 * been heard through the stream, and in Export mode the point is to hand over a
 * file. Playing it again would talk over the user.
 */
function publish(parts) {
  let merged = trimSilence(mergeChunks(parts));
  const gain = peakNormalize(merged);

  const blob = new Blob([encodeWav(merged, SR)], { type: 'audio/wav' });
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(blob);

  const audio = $('audio');
  audio.src = objectUrl;
  // The live stream and the file must never play at the same time.
  audio.onplay = () => { player?.stop(); };

  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  $('dl').href = objectUrl;
  $('dl').download = `sagapyaw-${VOICE}-${stamp}.wav`;
  $('size').textContent = `${(merged.length / SR).toFixed(1)}s · ${bytesLabel(blob.size)}`;
  $('out').classList.add('show');

  return { seconds: merged.length / SR, bytes: blob.size, gain };
}

/* ------------------------------------------------------------------ run ---- */

let running = null;
let stopped = false;

/**
 * Two ways to spend the same compute, chosen by the user rather than guessed.
 *
 * - `stream` (Realtime): play each sentence as soon as it is rendered, and keep
 *   rendering the next one while the current one is speaking. Starts in about a
 *   second. It cannot outrun the model: on a device slower than real time the
 *   gaps are audible, and that is accepted rather than worked around.
 * - `file` (Export): render the whole passage first, then hand over a WAV in an
 *   <audio> element. No gaps, but nothing to hear until it finishes.
 */
async function play(mode) {
  if (running) return;
  const text = $('text').value.trim();
  if (!text) {
    say('<span class="warn">စာသား ရိုက်ထည့်ပါ</span>');
    return;
  }

  setBusy(true);
  stopped = false;
  // A new run supersedes the last one's advice.
  $('hint').hidden = true;
  // Two takes at once is never what the user meant: silence whatever is still
  // playing before starting the next run.
  player?.stop();
  const audioEl = $('audio');
  if (!audioEl.paused) audioEl.pause();
  $('out').classList.remove('show');
  const abort = new AbortController();
  running = { chunks: 0, abort };

  const t0 = performance.now();
  let firstAudioMs = null;
  let audioSeconds = 0;
  let totalTokens = 0;
  let total = 0;
  // Realtime does not need a WAV to be heard, but building one is cheap and it
  // is how a listener gets a file without paying for the synthesis twice — the
  // model has already done the work by then. Measured: 30 ms to encode 89 s of
  // audio on a desktop, which is inside the run-to-run noise of the run itself.
  // So the WAV is not what makes a long passage fall behind; that is RTF.
  // `?wav=0` skips it, which matters only for memory: the kept chunks plus the
  // merged copy plus the encoded bytes are about 3x the audio, so ten minutes of
  // speech is ~140 MB held at once.
  const wantWav = mode === 'file' || params.get('wav') !== '0';
  const parts = [];
  $('phon').textContent = '';
  $('stats').innerHTML = '';

  try {
    // Inside the gesture: iOS only lets an AudioContext start from a tap.
    const p = getPlayer();
    if (mode === 'stream') await p.unlock();

    const s = await ensureModel();
    const tReady = performance.now();
    const initMs = tReady - t0;
    const gen = s.synthesizeStream(text, {
      // One chunk per sentence, so the pause lands on the writer's punctuation
      // instead of an arbitrary character count.
      chunking: 'sentence',
      // A short first chunk only helps when it is played immediately.
      firstLimit: mode === 'stream' ? Number(params.get('first') ?? 22) : 0,
      signal: abort.signal,
    });

    say(mode === 'stream' ? 'ဖတ်နေတယ် …' : 'အသံ ထုတ်နေတယ် …');

    for (;;) {
      const { value: chunk, done } = await gen.next();
      if (done) break;
      if (stopped) break;
      // With `?wav=0` nothing will read this copy back, so do not keep it.
      if (wantWav) parts.push(chunk.samples);
      if (DEV) $('phon').textContent += `${chunk.phon} `;
      audioSeconds += chunk.samples.length / SR;
      totalTokens += chunk.tokens;
      total = chunk.total;
      running.chunks = chunk.index + 1;

      if (mode === 'stream') {
        p.push(chunk.samples);
        if (firstAudioMs === null) firstAudioMs = performance.now() - t0;
        say(`<span class="ok">ဖွင့်နေတယ်</span> · အပိုင်း ${chunk.index + 1}/${chunk.total}`);
      } else {
        const frac = (chunk.index + 1) / chunk.total;
        setBar(frac);
        say(`အသံ ထုတ်နေတယ် … <b>${Math.round(frac * 100)}%</b> · ${audioSeconds.toFixed(1)}s`);
      }
      if (DEV) {
        $('stats').innerHTML =
          (firstAudioMs === null ? '' : `<span>ပထမအသံ <b>${(firstAudioMs / 1000).toFixed(2)}s</b></span>`) +
          `<span>အသံ <b>${audioSeconds.toFixed(2)}s</b></span>` +
          `<span>token <b>${totalTokens}</b></span>`;
      }
    }

    // Counted from the loop, not from `parts`: in Realtime mode nothing is kept
    // there, so an empty `parts` means "nothing to encode", not "nothing ran".
    if (!running.chunks) {
      say('<span class="warn">ရပ်လိုက်တယ်</span>');
      return;
    }

    const tPublish = performance.now();
    const file = wantWav ? publish(parts) : null;
    const publishMs = performance.now() - tPublish;
    const seconds = file ? file.seconds : audioSeconds;
    const bytes = file ? file.bytes : 0;
    const wall = performance.now() - t0;
    const synthMs = performance.now() - tReady;
    const rtf = synthMs / 1000 / Math.max(audioSeconds, 0.001);
    setBar(0);
    say(
      stopped
        ? '<span class="warn">ရပ်လိုက်တယ်</span>'
        : `<span class="ok">ပြီးပါပြီ</span> · ${seconds.toFixed(1)}s အသံ`,
    );
    // Realtime cannot beat the device. When the measurement says it fell behind,
    // say so once, at the moment it matters, and name the mode that does not
    // care how slow the phone is. The size of the problem is not the ratio but
    // how much dead air it adds up to: RTF 1.08 over two minutes is a pause you
    // notice, the same ratio over ten seconds is not.
    const deadAir = Math.max(0, rtf - 1) * audioSeconds;
    if (mode === 'stream' && !stopped && deadAir >= 2.5) {
      $('hint').innerHTML =
        `ဒီစက်မှာ တွက်နှုန်းက အသံထွက်နှုန်းထက် <b>${rtf.toFixed(1)} ဆ</b> နှေးတယ် · ` +
        'စာသားရှည်ရင် <b>WAV ထုတ်ပါ</b> က ကွက်လပ်မရှိဘူး';
      $('hint').hidden = false;
    }
    if (DEV) {
      $('stats').innerHTML =
        (firstAudioMs === null ? '' : `<span>ပထမအသံ <b>${(firstAudioMs / 1000).toFixed(2)}s</b></span>`) +
        `<span>အသံ <b>${seconds.toFixed(2)}s</b></span>` +
        `<span>RTF <b>${rtf.toFixed(2)}</b></span>` +
        `<span>ပြင်ဆင် <b>${secs(initMs)}</b></span>` +
        `<span>ပိုင်း <b>${total}</b></span>` +
        `<span>ဖိုင် <b>${file ? bytesLabel(bytes) : '—'}</b></span>` +
        `<span>WAV <b>${secs(publishMs)}</b></span>` +
        `<span>ကြာချိန် <b>${secs(wall)}</b></span>`;
    }

    window.__lastSynth = {
      mode,
      seconds,
      bytes,
      ms: wall,
      initMs,
      synthMs,
      publishMs,
      firstAudioMs: firstAudioMs ?? null,
      chunks: total,
      tokens: totalTokens,
      samples: Math.round(seconds * SR),
      gain: file ? file.gain : null,
      stopped,
    };
    document.title = `ok ${seconds.toFixed(2)}s`;
  } catch (err) {
    const msg = String(err?.message ?? err);
    const missing = /HTTP 404/.test(msg);
    say(
      `<span class="bad">${msg}</span>` +
        (missing
          ? `<br /><br />မော်ဒယ်ဖိုင် မတွေ့ပါ။ <code>models/${VOICE}/</code> ထဲမှာ ` +
            '<code>encoder.onnx</code>, <code>decoder.onnx</code>, <code>voice.json</code> ' +
            'ရှိရမယ်။ မရှိရင် <code>npm run fetch-models</code> ကို run ပါ။'
          : ''),
    );
    document.title = `error ${msg}`;
  } finally {
    running = null;
    setBusy(false);
  }
}

/** Stop whatever is happening, whether that is rendering or still-sounding audio. */
function stopRun() {
  stopped = true;
  running?.abort.abort();
  player?.stop();
  say('<span class="warn">ရပ်လိုက်တယ်</span>');
}

$('read').onclick = () => {
  // One button, two jobs: while anything is running or sounding it stops, and
  // the rest of the time it starts. The label already says which.
  if (running || player?.playing) stopRun();
  else play('stream');
};
$('export').onclick = () => play('file');

/* ---------------------------------------------------------------- voices -- */

const voiceList = $('voiceList');

/**
 * One pill per voice, always visible. The border carries the state:
 *   green  — the voice in use (`aria-pressed`), styled to outrank blue
 *   blue   — downloaded and ready (`cached`)
 *   grey   — still needs a download, marked with a down arrow
 *
 * The size and the "this takes a while" warning sit above the row, once, rather
 * than inside every pill — four copies of "181.2 MB" is what pushed the row
 * onto two lines on a phone.
 */
async function renderVoices() {
  const states = await Promise.all(
    VOICES.map(async (v) => ({
      ...v,
      cached: await isCached(Object.values(filesFor(v.id)).map((f) => f.url)),
    })),
  );
  voiceList.replaceChildren(
    ...states.map((v) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.voice = v.id;
      if (v.cached) button.classList.add('cached');
      button.setAttribute('aria-pressed', String(v.id === VOICE));
      button.innerHTML = `${v.label} <small>${v.cached ? '✓' : '⬇'}</small>`;
      button.onclick = () => selectVoice(v.id);
      return button;
    }),
  );
  // The warning is about work left to do, so it goes away once every voice is
  // on the device — a permanent warning is just noise.
  $('voiceNote').hidden = states.every((v) => v.cached);
}

/** Drop everything that belongs to the voice being left behind. */
function resetOutput() {
  player?.stop();
  $('out').classList.remove('show');
  const audio = $('audio');
  audio.pause();
  audio.removeAttribute('src');
  if (objectUrl) {
    URL.revokeObjectURL(objectUrl);
    objectUrl = null;
  }
  $('dl').removeAttribute('href');
  $('size').textContent = '';
  $('stats').innerHTML = '';
  $('phon').textContent = '';
  setBar(0);
}

async function selectVoice(id) {
  if (id === VOICE) return;
  if (running || loading) {
    say('<span class="warn">အသံ မပြောင်းခင် ခဏ စောင့်ပါ</span>');
    return;
  }

  // Release the old graphs first; the new voice is not touched until they are gone.
  synth?.dispose();
  synth = null;
  synthVoice = null;
  fileFrac.clear();

  VOICE = id;
  FILES = filesFor(id);
  history.replaceState(null, '', `?voice=${encodeURIComponent(id)}`);
  resetOutput();

  touchVoice(id);
  const cached = await isCached(Object.values(FILES).map((f) => f.url));
  say(
    cached
      ? `<span class="ok">${voiceLabel(id)}</span> · cache ထဲမှာ ရှိပြီး`
      : `<b>${voiceLabel(id)}</b> · ${bytesLabel(TOTAL_WEIGHT)} ဒေါင်းလုပ်ရမယ်`,
  );
  refreshStorage();
  renderVoices();
}

// Fill the row on first paint: the cache state decides which pills are blue.
renderVoices();

$('env').innerHTML = isolated
  ? `<span class="dot ok"></span>${ort.env.wasm.numThreads} threads`
  : `<span class="dot warn"></span>threads 1`;
// The healthy state is not information the user can act on; the degraded state
// is, because it makes a phone stutter. Show only the warning chip.
if (!isolated) { $('env').hidden = false; $('env').classList.add('show'); }

async function refreshStorage() {
  const est = await storageEstimate();
  const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : false;
  const parts = [`<span>voice <code>${VOICE}</code></span>`];
  if (DEV) {
    // A picker, not a fixed number: on a big.LITTLE phone 3 threads can beat 4,
    // because the fourth worker lands on a little core and the main thread waits
    // on it. The only way to know is to try both on the device in hand.
    // The list goes up to the core count, not to the default: the shipped
    // default stays `Math.min(4, hw)`, but a phone that reports 8 cores can be
    // asked to try 5 or 6 from here, which is the one way to find out whether
    // the extra workers help or land on efficiency cores. Capped at 8 because
    // past that the workers contend more than they compute.
    const maxThreads = Math.min(8, Math.max(4, hw));
    const threadOptions = Array.from({ length: maxThreads }, (_, i) => i + 1)
      .map((n) => `<option value="${n}"${n === ort.env.wasm.numThreads ? ' selected' : ''}>${n}</option>`)
      .join('');
    parts.push(
      isolated
        ? `<span>threads <select id="thr">${threadOptions}</select> / ${hw} cores</span>`
        : `<span>threads <code>1</code> / ${hw} cores</span>`,
    );
    if (est) parts.push(`<span>storage <code>${bytesLabel(est.usage)}</code> / ${bytesLabel(est.quota)}</span>`);
    // "not persisted" reads like an error the user must fix; it is only useful
    // to someone inspecting storage policy.
    parts.push(`<span>${persisted ? '<span class="dot ok"></span>persisted' : '<span class="dot warn"></span>not persisted'}</span>`);
    parts.push('<button class="ghost" id="clear">cache ရှင်းပါ</button>');
  }
  $('details').innerHTML = parts.join('');
  const thr = $('thr');
  if (thr) {
    thr.onchange = () => {
      const next = new URLSearchParams(location.search);
      // Picking the default again should not leave a sticky param behind.
      if (Number(thr.value) === Math.min(4, hw)) next.delete('threads');
      else next.set('threads', thr.value);
      location.search = next.toString();
    };
  }
  const clear = $('clear');
  if (clear) {
    clear.onclick = async () => {
      await clearModelCache();
      location.reload();
    };
  }
}
refreshStorage();

let installEvent = null;
addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installEvent = e;
  $('install').hidden = false;
});
$('install').onclick = async () => {
  if (!installEvent) return;
  installEvent.prompt();
  await installEvent.userChoice;
  installEvent = null;
  $('install').hidden = true;
};

if ('serviceWorker' in navigator && location.protocol !== 'file:' && params.get('sw') !== '0') {
  // A new build arrives as new bytes in sw.js. The fresh worker claims this page
  // at once, but the page in front of the user was rendered from the old shell,
  // so reload once — that is what saves them from being told to hard-reload.
  // Skipped on a first visit (nothing controlled this page, so the claim is not
  // an update) and skipped once anything has been touched, where a reload would
  // throw away what the user typed.
  const wasControlled = Boolean(navigator.serviceWorker.controller);
  let touched = false;
  const markTouched = () => {
    touched = true;
  };
  addEventListener('input', markTouched, { capture: true, once: true });
  addEventListener('pointerdown', markTouched, { capture: true, once: true });
  addEventListener('keydown', markTouched, { capture: true, once: true });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!wasControlled || touched || reloaded) return;
    reloaded = true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Warm up in the background when the model is already on disk: the first tap
// should be instant, not a 2 second session build.
touchVoice(VOICE);
isCached(Object.values(FILES).map((f) => f.url)).then((cached) => {
  if (!cached) {
    say(`${bytesLabel(TOTAL_WEIGHT)} မော်ဒယ်ကို ပထမအကြိမ် ဒေါင်းလုပ်ရမယ် · <b>ဖတ်ပါ</b> နှိပ်ရင် စမယ်`);
    return;
  }
  // `?prewarm=0` keeps the cache check but skips building the sessions. It exists
  // so the UI can be inspected without 181 MB of weights entering the tab.
  if (params.get('prewarm') === '0') return;
  ensureModel()
    .then(() => say('<span class="ok">အဆင်သင့်</span>'))
    .catch((err) => say(`<span class="bad">${err.message}</span>`));
});

// `?auto=read` / `?auto=export` runs one action for the headless harnesses.
const auto = params.get('auto');
if (auto) setTimeout(() => (auto === 'export' ? $('export') : $('read')).click(), 80);
</script>
</body>
</html>
